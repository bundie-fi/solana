# Charlie - Bundie rate-prediction-market agent (Option X third agent)
#
# Devnet SNS:    charlie.bundie (under protocol-owned .bundie root, PDA Hpz5jemSePzEDZwMH6WemVBSatkeNy7AtgZPBb6ENxHS)
# Mainnet SNS:   charlie.bundie.sol (via Bonfida .sol root; post-hackathon)
# Vault address: 8zNazDgyrTX1CTaPk4G6hZ8r47SbVajh1vcFrqNAzBFg
# Strategy:      conservative-60-40-split (60% USDC / 40% mSOL)
#
# DENY-by-default: every rebalance tx passes through this policy list.
# Enforcement happens in packages/zerion-agent/src/bundie/policies.js
# via makeEnforcer(). If any predicate returns allow:false, the Zerion
# vault does NOT sign.
#
# SYMMETRIC POLICY (Option X): charlie's allowlist covers BOTH market-creator
# ops (PM program) AND strategy-execution ops (Kamino / Marinade / SPL stake
# pool). Every agent has the same allowlist — the ONLY thing preventing an
# agent from creating a market on its own strategy is the on-chain guard in
# `create_market_v2` (MarketError::InsiderMarketForbidden). Separation is
# mathematical, not a policy convention.

sns_identity: charlie.bundie
vault_address: "8zNazDgyrTX1CTaPk4G6hZ8r47SbVajh1vcFrqNAzBFg"
strategy: conservative-60-40-split

armed_at_ms: 1714000000000

policies:
  - id: chain_lock
    config:
      allowed_chains:
        - solana

  - id: asset_whitelist
    config:
      allowed_mints:
        - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
        - 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
        - mSoLzYCxHdYgdzU16g5QSh3i5K3z3KZK7ytfqcJm7So
        - So11111111111111111111111111111111111111112

  - id: spend_limit
    config:
      max_notional_usd_per_rebalance: 15
      max_notional_usd_per_day: 75

  - id: expiry
    config:
      # 1000d from armed_at_ms (2024-04-25) = 2027-01-20 — same rationale
      # as alice/bob: keeps in-scope attempts ALLOWED without disabling
      # the expiry gate. Re-arm still required post-expiry.
      max_age_days: 1000

  - id: nav_divergence
    config:
      max_drop_pct: 7
      window_minutes: 60

  # Symmetric program allowlist (Option X): every agent can
  #  (a) create/trade/resolve prediction markets via the PM program, AND
  #  (b) execute strategy ops on Kamino / Marinade / SPL stake pool.
  # The on-chain guard in create_market_v2 forbids an agent from creating a
  # kind=6 market targeting its own vault (MarketError::InsiderMarketForbidden),
  # so there is no risk in broadening the allowlist to cover both sides.
  - id: program_allowlist
    config:
      programs:
        # Bundie Prediction Market (market-creator side)
        - programId: "Bun4h9qr4NnQNa5qPePK48cP63R59hHSQDt8ipge4fT4"
          instructions: [create_market_v2, buy_shares, sell_shares, resolve_market_v2]
        # Kamino Lend (strategy side)
        - programId: "KLend2g3cP87fffoy8q1mQqGKjrxjC8boSyAYavgmjD"
          instructions: [deposit_reserve_liquidity, withdraw_reserve_liquidity, refresh_reserve]
        # Marinade Liquid Staking
        - programId: "MarBmsSgKXdrN1egZf5sqe1TMai9K1rChYNDJgjq7aD"
          instructions: [deposit, liquid_unstake]
        # SPL Stake Pool (JitoSOL, bSOL, jSOL — canonical program id, same
        # on mainnet and devnet; the user-supplied `Jito4...` placeholder
        # was not the real program id).
        - programId: "SPoo1Ku8WFXoNDMHPsrGSTSG1Y47rzgn41SLUNakuHy"
          instructions: [deposit_sol, withdraw_sol]
