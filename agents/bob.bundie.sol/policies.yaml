# Bob - Bundie rate-prediction-market agent
#
# SNS identity:   bob.bundie.sol
# Vault address:  <REPLACE_WITH_BOB_VAULT_PUBKEY>   filled in Phase 6 post-deploy
# Strategy:       conservative-split-usdc-msol
#
# DENY-by-default: every rebalance tx passes through this policy list.
# Enforcement happens in packages/zerion-agent/src/bundie/policies.js
# via makeEnforcer(). If any predicate returns allow:false, the Zerion
# vault does NOT sign.
#
# Bob runs tighter thresholds than alice: smaller per-rebalance cap,
# smaller daily cap, and a 5% kill-switch (vs alice's 10%).

sns_identity: bob.bundie.sol
vault_address: "REPLACE_WITH_BOB_VAULT_PUBKEY"
strategy: conservative-split-usdc-msol

armed_at_ms: 1714000000000

policies:
  - id: chain_lock
    config:
      allowed_chains:
        - solana

  - id: asset_whitelist
    config:
      allowed_mints:
        - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
        - 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
        - mSoLzYCxHdYgdzU16g5QSh3i5K3z3KZK7ytfqcJm7So
        - So11111111111111111111111111111111111111112

  - id: spend_limit
    config:
      max_notional_usd_per_rebalance: 10
      max_notional_usd_per_day: 50

  - id: expiry
    config:
      max_age_days: 38

  - id: nav_divergence
    config:
      max_drop_pct: 5
      window_minutes: 60
