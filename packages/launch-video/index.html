<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bundie · launch video</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0908;
      }
    </style>
  </head>
  <body>
    <!--
      Bundie launch video · v5 · 30s · 10 frames · 24fps
      Dark editorial Bundie-Solana brand with v5 palette shift.
      Audio drop aligns to F3 terminal command (video 0:08).
      Alternating tracks → 0.4s crossfade overlap between frames.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="f1"  class="clip" data-composition-id="f1"  data-composition-src="compositions/f1-hook.html"     data-start="0"  data-duration="3.4" data-track-index="1"></div>
      <div id="f2"  class="clip" data-composition-id="f2"  data-composition-src="compositions/f2-agent.html"    data-start="3"  data-duration="2.4" data-track-index="2"></div>
      <div id="f3"  class="clip" data-composition-id="f3"  data-composition-src="compositions/f3-terminal.html" data-start="5"  data-duration="3.4" data-track-index="1"></div>
      <div id="f4"  class="clip" data-composition-id="f4"  data-composition-src="compositions/f4-composed.html" data-start="8"  data-duration="3.4" data-track-index="2"></div>
      <div id="f5"  class="clip" data-composition-id="f5"  data-composition-src="compositions/f5-coin.html"     data-start="11" data-duration="3.4" data-track-index="1"></div>
      <div id="f6"  class="clip" data-composition-id="f6"  data-composition-src="compositions/f6-triad.html"    data-start="14" data-duration="3.4" data-track-index="2"></div>
      <div id="f7"  class="clip" data-composition-id="f7"  data-composition-src="compositions/f7-back.html"     data-start="17" data-duration="3.4" data-track-index="1"></div>
      <div id="f8"  class="clip" data-composition-id="f8"  data-composition-src="compositions/f8-predict.html"  data-start="20" data-duration="3.4" data-track-index="2"></div>
      <div id="f9"  class="clip" data-composition-id="f9"  data-composition-src="compositions/f9-settle.html"   data-start="23" data-duration="3.4" data-track-index="1"></div>
      <div id="f10" class="clip" data-composition-id="f10" data-composition-src="compositions/f10-end.html"     data-start="26" data-duration="4"   data-track-index="2"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
