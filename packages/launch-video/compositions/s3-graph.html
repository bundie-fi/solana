<style>
[data-composition-id="s3"] {
  width: 1920px;
  height: 1080px;

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  const r = '[data-composition-id="s3"] ';

  tl.from('[data-composition-id="s3"]', { opacity: 0, duration: 0.35, ease: 'power2.out' }, 0);
  tl.from(r + '.prompt-bubble', { y: -30, opacity: 0, duration: 0.45, ease: 'power3.out' }, 0.1);

  // Center node materializes with a glow
  tl.from(r + '.n-center', { scale: 0, opacity: 0, transformOrigin: '700px 310px', duration: 0.55, ease: 'back.out(1.8)' }, 0.5);

  // Edges draw out (stroke-dash animation)
  const edges = ['.e1', '.e2', '.e3', '.e4', '.e5', '.e6'];
  edges.forEach((e, i) => {
    tl.fromTo(r + e,
      { strokeDasharray: 400, strokeDashoffset: 400 },
      { strokeDashoffset: 0, duration: 0.45, ease: 'power2.out' },
      0.85 + i * 0.08);
  });

  // Branch nodes fade in at end of each edge
  const nodes = ['.n1', '.n2', '.n3', '.n4', '.n5', '.n6'];
  nodes.forEach((n, i) => {
    tl.from(r + n,
      { scale: 0.7, opacity: 0, transformOrigin: 'center', duration: 0.35, ease: 'back.out(1.6)' },
      1.15 + i * 0.08);
  });

  // Ambient center glow pulse
  tl.to(r + '.n-center circle:first-child',
    { opacity: 0.35, duration: 0.8, ease: 'sine.inOut', yoyo: true, repeat: 1 },
    1.8);

  window.__timelines['s3'] = tl;
})();
</script>
