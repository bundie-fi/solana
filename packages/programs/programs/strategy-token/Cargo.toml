[package]
name = "strategy-token"
version = "0.1.0"
description = "Bundie Strategy Token Program — pinocchio + Beethoven"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "strategy_token"

[features]
no-entrypoint = []
default = []
idl-build = []

[dependencies]
pinocchio = { version = "0.10", default-features = false, features = ["cpi"] }
beethoven = { path = "../../../beethoven", features = [
    # Deposit — lending vaults + liquid staking + vault aggregators
    "kamino-deposit",
    "jupiter-deposit",
    "drift-deposit",
    "marginfi-deposit",
    "marinade-deposit",        # devnet ✓ — liquid staking (SOL → mSOL)
    "solend-deposit",          # devnet ✓ — lending
    "spl-stake-pool-deposit",  # devnet ✓ — covers BlazeStake/Jito/custom LSTs
    "drift-vaults-deposit",    # devnet ✓ — vault aggregator on top of Drift
    "meteora-vaults-deposit",  # devnet ✓ — Mercurial-style yield router
    # Perps (derivatives)
    "mango-perps",
    "zeta-perps",  # devnet ✓ — futures + options, cross-margin
    # Swap (DEX routing) — original 14 + 8 new (4 Raydium + Orca + 2 Meteora + 2 CLOBs)
    "raydium-cpmm-swap",        # mainnet pools
    "raydium-cpmm-devnet-swap", # devnet variant (different program ID)
    "raydium-clmm-swap",        # devnet ✓ — concentrated liquidity
    "raydium-amm-v4-swap",      # devnet ✓ — legacy CP
    "orca-whirlpools-swap",     # devnet ✓ — CLMM
    "meteora-dlmm-swap",        # devnet ✓ — bin-based AMM
    "meteora-damm-v2-swap",     # devnet ✓ — CP
    "phoenix-swap",             # devnet ✓ — CLOB
    "openbook-v2-swap",         # devnet ✓ — CLOB
    "manifest-swap",            # devnet markets confirmed
    "aldrin-swap",
    "aldrin_v2-swap",
    "futarchy-swap",
    "gamma-swap",
    "hadron-swap",
    "heaven-swap",
    "omnipair-swap",
    "perena-swap",
    "scale_amm-swap",
    "scale_vmm-swap",
    "solfi-swap",
    "solfi_v2-swap",
] }
# curve25519 needed for find_program_address on host (cargo check); on SBF uses syscalls.
# no_std is not used here (beethoven's deps pull in std), so this is safe on all targets.
solana-address = { version = "2.0", features = ["curve25519"] }
