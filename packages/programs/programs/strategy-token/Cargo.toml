[package]
name = "strategy-token"
version = "0.1.0"
description = "Yields.so Strategy Token Program - mint tradeable shares tracking live portfolio value"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "strategy_token"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[lints]
workspace = true

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.0", features = ["token", "associated_token", "metadata"] }
