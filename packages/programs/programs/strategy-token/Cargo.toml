[package]
name = "strategy-token"
version = "0.1.0"
description = "Yields.so Strategy Token Program — pinocchio + Beethoven"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "strategy_token"

[features]
no-entrypoint = []
default = []

[dependencies]
pinocchio = { version = "0.10", default-features = false, features = ["cpi"] }
beethoven = { git = "https://github.com/blueshift-gg/beethoven", features = ["kamino-deposit"] }
# curve25519 needed for find_program_address on host (cargo check); on SBF uses syscalls
solana-address = { version = "2.0", features = ["curve25519"] }
