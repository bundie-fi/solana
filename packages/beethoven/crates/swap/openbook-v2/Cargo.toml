[package]
name = "beethoven-swap-openbook-v2"
description = "OpenBook v2 CLOB swap implementation for Beethoven (place_take_order, IOC)"
version = "0.0.1"
license = "MIT"
edition = "2021"

[dependencies]
beethoven-core = { path = "../../core" }
solana-account-view = "1.0.0"
solana-address = { version = "2.0.0", features = ["decode"] }
solana-instruction-view = "1.0.0"
solana-program-error = "3.0.0"
